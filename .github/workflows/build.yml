name: Build and package

on:
  push:
    branches: ["feature/minimal-touchpad-gyro"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build (tests disabled)
        shell: cmd
        run: build.cmd

      - name: Package release
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir dist

      - name: Prepare installable files
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "Release ZIP was not created." }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath dist\install -Force

      - name: Upload installable files
        uses: actions/upload-artifact@v4
        with:
          name: bl4-gyro-windows
          path: dist/install/**
          if-no-files-found: error
